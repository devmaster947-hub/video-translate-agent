[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "video-translate-agent"
version = "2.3.4"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "faster-whisper>=1.1,<2",
  "requests>=2.32,<3",
  "rapidocr>=3.9,<4",
  "onnxruntime>=1.20,<2",
  "opencv-python>=4.10,<5",
  "numpy>=1.26,<3",
  "keyring>=25,<26",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
sttn = ["torch>=2.5,<3"]

[tool.setuptools.packages.find]
include = ["video_translate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: explicitly enabled external API tests", "media: real FFmpeg integration"]

[tool.setuptools.package-data]
"video_translate.vendor.sttn" = ["sttn.pth", "LICENSE"]
